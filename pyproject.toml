[project]
name = "team-arkod"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["./src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkod"]